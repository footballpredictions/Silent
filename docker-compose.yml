version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: silent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silent_pass}
      POSTGRES_DB: silent_vpn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silent -d silent_vpn"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - silent_net

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-silent_redis}
    volumes:
      - redis_data:/data
    networks:
      - silent_net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://silent:${POSTGRES_PASSWORD:-silent_pass}@db:5432/silent_vpn
      REDIS_URL: redis://:${REDIS_PASSWORD:-silent_redis}@redis:6379
      BUILD_AGENT_HOST_ROOT: /opt/silent-vpn/backend/build-agent
    volumes:
      - ./static:/app/static
      - ./cell-agent:/app/cell-agent:ro
      - ./admin-ui/dist:/app/admin-ui/dist:ro
      - ./update:/app/update
      - ./build-agent:/app/build-agent
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/android-sdk:/opt/android-sdk
      - /usr/local/bin/wdtt-server:/app/wdtt/wdtt-server:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - silent_net
    ports:
      # localhost only — nginx :443 and tunnel DNAT 10.66.66.1:8000 stay reachable; no public HTTP API
      - "127.0.0.1:8000:8000"

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/silent:ro
    networks:
      - silent_net

  # wdtt VPN server (WireGuard over VK TURN)
  wdtt:
    image: alpine:3.19
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./wdtt:/opt/wdtt
      - wdtt_data:/var/lib/wdtt
    working_dir: /opt/wdtt
    command: sh -c "chmod +x wdtt-server && ./wdtt-server"
    network_mode: host
    environment:
      WDTT_PASSWORD: ${WDTT_MASTER_PASSWORD:-change_this_password}
      WDTT_PORT: ${WDTT_PORT:-56000}
      WDTT_WG_PORT: ${WDTT_WG_PORT:-56001}
      WDTT_SUBNET: "10.66.0.0/16"

volumes:
  postgres_data:
  redis_data:
  wdtt_data:

networks:
  silent_net:
    driver: bridge
