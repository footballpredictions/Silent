limit_req_zone $binary_remote_addr zone=payment_notify:10m rate=10r/s;

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/153-52-117-159.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/153-52-117-159.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name 153-52-117-159.nip.io;
    client_max_body_size 32k;
    client_body_timeout 10s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/silent-payment-relay;
    }

    location = /api/payments/yumoney/notify {
        limit_req zone=payment_notify burst=50 nodelay;
        limit_req_status 503;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:9180;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:9180;
        proxy_read_timeout 5s;
    }

    location / { return 404; }
}
